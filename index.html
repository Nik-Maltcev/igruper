<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Superigruper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      * { image-rendering: pixelated; }
      body {
        font-family: 'Press Start 2P', monospace;
        background-color: #0a0a1a;
        color: #e0e0e0;
        zoom: 1.3;
      }
      /* Pixel border utility */
      .pixel-border {
        border: 4px solid;
        border-image: repeating-linear-gradient(90deg, currentColor 0px, currentColor 4px, transparent 4px, transparent 8px) 4;
      }
      .pixel-box {
        box-shadow: 
          4px 0 0 0 currentColor,
          -4px 0 0 0 currentColor,
          0 4px 0 0 currentColor,
          0 -4px 0 0 currentColor;
      }
      /* Retro button */
      .retro-btn {
        position: relative;
        border: none;
        padding: 12px 20px;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.1s;
        box-shadow: 4px 4px 0px #000;
      }
      .retro-btn:hover {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px #000;
      }
      .retro-btn:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px #000;
      }
      .retro-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
        box-shadow: 4px 4px 0px #000;
      }
      /* Scanline overlay */
      .scanlines::after {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,0.08) 2px,
          rgba(0,0,0,0.08) 4px
        );
        pointer-events: none;
        z-index: 9999;
      }
      /* Pixel card */
      .pixel-card {
        background: #1a1a2e;
        border: 3px solid #333;
        box-shadow: 4px 4px 0px #000;
      }
      .pixel-card:hover {
        border-color: #5555ff;
      }
      /* Retro scrollbar */
      ::-webkit-scrollbar { width: 12px; }
      ::-webkit-scrollbar-track { background: #0a0a1a; }
      ::-webkit-scrollbar-thumb { background: #333; border: 2px solid #0a0a1a; }
      /* Blink animation */
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      .blink { animation: blink 1s step-end infinite; }
      /* Retro gradient text */
      .retro-title {
        background: linear-gradient(180deg, #ffff00 0%, #ff8800 50%, #ff0000 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(2px 2px 0px #000);
      }
      /* === Loading screen === */
      .ls-root { position: fixed; inset: 0; background: #0a0512; overflow: hidden; z-index: 9990; }
      .ls-bg { position: absolute; inset: -4%; background: url('/loader-bg.webp') center/cover no-repeat; image-rendering: pixelated; animation: lsZoom 14s ease-in-out infinite alternate; }
      @keyframes lsZoom { from { transform: scale(1); } to { transform: scale(1.06); } }
      .ls-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 46%, rgba(8, 2, 16, .55) 0%, rgba(8, 2, 16, .15) 45%, transparent 75%); }
      .ls-scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .ls-title { font-size: 52px; letter-spacing: 6px; color: #fff; transform: skew(-4deg); text-shadow: 3px 3px 0 #05d9e8, -2px -2px 0 #ff2a6d, 0 0 12px #ff2a6d, 0 0 42px #b537f2; animation: lsNeon 4s linear infinite; }
      @keyframes lsNeon { 0%, 100% { opacity: 1; } 90% { opacity: 1; } 91% { opacity: .5; } 92% { opacity: 1; } 95% { opacity: .7; } 96% { opacity: 1; } }
      .ls-sub { color: #05d9e8; font-size: 11px; letter-spacing: 10px; text-shadow: 0 0 10px #05d9e8, 0 0 24px rgba(5, 217, 232, .6); }
      .ls-bar-row { display: flex; align-items: center; gap: 14px; }
      .ls-bar { width: min(420px, 68vw); height: 22px; border: 3px solid #05d9e8; background: rgba(10, 2, 20, .85); box-shadow: 0 0 14px rgba(5, 217, 232, .5), 4px 4px 0 rgba(0, 0, 0, .8); padding: 3px; }
      .ls-bar-fill { height: 100%; width: 0%; background-image: repeating-linear-gradient(90deg, transparent 0 11px, rgba(10, 2, 20, .9) 11px 14px), linear-gradient(90deg, #ff2a6d, #ff9de2); box-shadow: 0 0 12px rgba(255, 42, 109, .8); }
      .ls-bar-fill.ls-anim { animation: lsFill 2s steps(16) forwards; }
      @keyframes lsFill { from { width: 0%; } to { width: 92%; } }
      .ls-pct { font-size: 10px; color: #ff9de2; min-width: 44px; text-shadow: 0 0 8px #ff2a6d; }
      .ls-phrase { font-size: 9px; color: #c8b6ff; letter-spacing: 2px; text-shadow: 0 0 8px rgba(181, 55, 242, .8); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="scanlines">
    <div id="root">
      <!-- Прелоадер: виден до загрузки React, заменяется компонентом LoadingScreen -->
      <div class="ls-root">
        <div class="ls-bg"></div>
        <div class="ls-vignette"></div>
        <div class="ls-scene">
          <div class="ls-title">IGRUPER</div>
          <div class="ls-sub">RACE MANAGER</div>
          <div class="ls-bar-row">
            <div class="ls-bar"><div class="ls-bar-fill ls-anim"></div></div>
          </div>
          <div class="ls-phrase blink">ЗАВОДИМ ДВИГАТЕЛЬ...</div>
        </div>
      </div>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
