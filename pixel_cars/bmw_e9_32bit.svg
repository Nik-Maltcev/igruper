<svg xmlns="http://www.w3.org/2000/svg" width="200" height="112" viewBox="0 0 200 112" shape-rendering="crispEdges">
  <rect width="200" height="112" fill="transparent"/>

  <!-- тень под машиной -->
  <ellipse cx="100" cy="102" rx="90" ry="6" fill="#00000038"/>

  <!-- ═══ ЗАДНЯЯ ЧАСТЬ КУЗОВА (тёмная плоскость заднего крыла) ═══ -->
  <polygon points="124,28 146,42 176,50 176,66 150,62 128,46" fill="#1d5236"/>
  <!-- крышка багажника (свет сверху) -->
  <polygon points="146,42 174,48 172,54 148,49" fill="#3f9868"/>

  <!-- ═══ ОСНОВНОЙ БОРТ ═══ -->
  <!-- борт: верх повторяет нижнюю кромку капота, пояс, порог -->
  <polygon points="14,58 86,42 146,48 176,52 176,74 30,74 18,70" fill="#2a7049"/>

  <!-- ═══ КРЫША + КАБИНА ═══ -->
  <!-- лобовое стекло (наклонная плоскость) -->
  <polygon points="78,43 92,24 116,24 106,43" fill="#182633"/>
  <polygon points="88,34 96,27 101,27 93,36" fill="#3c5a76"/>
  <!-- передняя стойка (тонкая, по левому краю лобового) -->
  <polygon points="92,24 95,25 86,42 82,43" fill="#2a7049"/>
  <!-- боковое стекло двери -->
  <polygon points="97,28 114,28 116,43 96,43" fill="#182633"/>
  <polygon points="99,30 104,30 102,35 97,35" fill="#3c5a76"/>
  <!-- средняя стойка -->
  <rect x="114" y="28" width="2" height="15" fill="#2a7049"/>
  <!-- боковое стекло заднего четверть-окна -->
  <polygon points="118,28 128,28 134,41 118,43" fill="#182633"/>
  <!-- заднее стекло (фастбек, верхняя плоскость) -->
  <polygon points="128,25 146,40 140,44 124,31" fill="#182633"/>
  <!-- задняя стойка -->
  <polygon points="128,22 132,23 148,40 144,44 130,31" fill="#2a7049"/>
  <!-- крыша (светлая плоскость сверху) -->
  <polygon points="91,21 128,21 130,26 93,26" fill="#3f9868"/>
  <!-- зеркало (торчит у основания стойки) -->
  <polygon points="76,33 83,31 83,37 76,38" fill="#0b2018"/>

  <!-- ═══ КАПОТ (светлая верхняя плоскость) ═══ -->
  <polygon points="10,52 82,38 86,42 14,58" fill="#3f9868"/>

  <!-- ═══ ПЕРЕДНЯЯ ПАНЕЛЬ (акульий нос) ═══ -->
  <polygon points="8,52 14,56 14,74 10,72 4,60" fill="#236140"/>
  <polygon points="14,56 30,52 32,74 14,74" fill="#236140"/>
  <!-- 4 круглые фары 2x2 -->
  <rect x="16" y="56" width="6" height="6" fill="#9a9478"/><rect x="17" y="57" width="4" height="4" fill="#f3eec4"/>
  <rect x="16" y="64" width="6" height="6" fill="#9a9478"/><rect x="17" y="65" width="4" height="4" fill="#f3eec4"/>
  <rect x="24" y="55" width="6" height="6" fill="#9a9478"/><rect x="25" y="56" width="4" height="4" fill="#f3eec4"/>
  <rect x="24" y="63" width="6" height="6" fill="#9a9478"/><rect x="25" y="64" width="4" height="4" fill="#f3eec4"/>
  <!-- ноздри решётки между фарами -->
  <rect x="22" y="58" width="2" height="10" fill="#0b2018"/>
  <!-- указатель поворота -->
  <rect x="28" y="70" width="4" height="3" fill="#e8a020"/>

  <!-- ═══ БАМПЕРЫ (хром) ═══ -->
  <polygon points="4,68 30,72 30,80 26,84 8,80 2,74" fill="#c9cdd5"/>
  <polygon points="2,74 26,80 26,84 8,80" fill="#878e99"/>
  <polygon points="170,60 190,62 194,72 190,78 170,76" fill="#c9cdd5"/>
  <polygon points="190,66 194,72 190,78 186,77" fill="#878e99"/>
  <!-- задний фонарь -->
  <rect x="176" y="50" width="7" height="5" fill="#c23a2e"/>

  <!-- ═══ ДЕТАЛИ БОРТА ═══ -->
  <!-- характерная линия -->
  <rect x="34" y="54" width="110" height="1" fill="#3f9868"/>
  <!-- шов двери + ручка -->
  <rect x="104" y="46" width="1" height="26" fill="#0b2018"/>
  <rect x="108" y="49" width="7" height="2" fill="#878e99"/>
  <!-- порог в тени -->
  <rect x="30" y="72" width="146" height="3" fill="#1d5236"/>
  <!-- арки колёс (тёмно-зелёные, без чёрных клиньев) -->
  <polygon points="32,74 62,74 60,64 38,64 30,70" fill="#1d5236"/>
  <polygon points="142,74 174,74 172,62 148,62 142,70" fill="#1d5236"/>

  <!-- ═══ КОЛЁСА ═══ -->
  <!-- переднее -->
  <rect x="32" y="72" width="28" height="26" rx="2" fill="#17191d"/>
  <rect x="38" y="78" width="16" height="14" rx="1" fill="#6b727e"/>
  <rect x="40" y="80" width="12" height="10" fill="#b7bdc7"/>
  <rect x="45" y="80" width="2" height="10" fill="#6b727e"/>
  <rect x="40" y="84" width="12" height="2" fill="#6b727e"/>
  <!-- заднее -->
  <rect x="144" y="72" width="28" height="24" rx="2" fill="#17191d"/>
  <rect x="150" y="77" width="16" height="13" rx="1" fill="#6b727e"/>
  <rect x="152" y="79" width="12" height="9" fill="#b7bdc7"/>
  <rect x="157" y="79" width="2" height="9" fill="#6b727e"/>
  <rect x="152" y="83" width="12" height="2" fill="#6b727e"/>
</svg>